function ls_get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function ls_set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme==='auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : state.theme);
  document.getElementById('themeBtn').textContent = (document.documentElement.getAttribute('data-theme')==='dark') ? '☀️' : '🌙';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  state.theme = cur==='dark' ? 'light' : 'dark';
  ls_set('sc_theme',state.theme); applyTheme();
}
function changeFs(d){ state.fs=Math.max(13,Math.min(20,state.fs+d)); document.documentElement.style.setProperty('--fs',state.fs+'px'); ls_set('sc_fs',state.fs); }

function showTab(tab){
  state.tab=tab;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+tab).classList.add('on');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='stats') renderStats();
  if(tab==='dir') renderDirectory();
}

function allEntries(){
  const out=[];
  DAYS.forEach(d=>state.data[d].forEach((e,i)=>out.push({d,i,...e})));
  return out;
}

function toMinutes(hhmm){ const p=hhmm.split(':'); return (+p[0])*60+(+(p[1]||0)); }

function updateBanner(){
  const now=new Date();
  const map=[null,'mon','tue','wed','thu','fri','sat'];
  const todayKey=map[now.getDay()];
  const nowMin=now.getHours()*60+now.getMinutes();
  const b=document.getElementById('banner');
  let cur=null;
  if(todayKey){
    (state.data[todayKey]||[]).forEach(e=>{
      const [a,z]=e.t.split('-'); if(toMinutes(a)<=nowMin&&nowMin<toMinutes(z)) cur={...e,day:todayKey};
    });
  }
  if(cur){
    const end=cur.t.split('-')[1];
    b.className='banner live';
    b.innerHTML=`<div class="k"><span class="dot"></span>${t('nowLbl')}</div><div class="v">${cur.s}${cur.g?' · '+cur.g:''}</div><div class="m">${cur.c} · ${cur.r} · ${t('till')} ${end}</div>`;
    return;
  }
  b.className='banner';
  const order=[]; const startIdx=DAYS.indexOf(todayKey)>=0?DAYS.indexOf(todayKey):0;
  for(let k=0;k<7;k++) order.push(DAYS[(startIdx+k)%6]);
  let next=null;
  for(const d of order){
    const list=(state.data[d]||[]).slice().sort((a,b2)=>toMinutes(a.t.split('-')[0])-toMinutes(b2.t.split('-')[0]));
    for(const e of list){
      const isToday = d===todayKey;
      if(!isToday || toMinutes(e.t.split('-')[0])>nowMin){ next={...e,day:d}; break; }
    }
    if(next) break;
  }
  if(next){
    const dn = DNAME[state.lang][next.day];
    b.innerHTML=`<div class="k"><span class="dot" style="background:#1fae66"></span>${t('nextLbl')}</div><div class="v">${next.s}${next.g?' · '+next.g:''}</div><div class="m">${dn} · ${t('at')} ${next.t.split('-')[0]} · ${next.r}</div>`;
  } else {
    b.innerHTML=`<div class="k">${t('nowLbl')}</div><div class="v">${t('nowFree')}</div>`;
  }
}

function renderChips(){
  const box=document.getElementById('dayChips');
  box.innerHTML=DAYS.map(d=>`<button class="${d===state.day&&!state.query?'on':''}" onclick="selectDay('${d}')">${DSHORT[state.lang][d]}<span class="n">${state.data[d].length}</span></button>`).join('');
}
function selectDay(d){ state.day=d; state.query=''; document.getElementById('searchBox').value=''; renderChips(); renderSched(); }

function classCard(e,d,i){
  const ty=TY[e.y]||TY.LK;
  return `<div class="card" data-key="${d}-${i}" style="border-left-color:${ty.col}">
    <div class="row1"><span class="time">${e.t}</span><span class="badge" style="background:${ty.col}">${ty.ab}</span><span style="flex:1"></span><button class="iconsm" onclick='openClassForm(${JSON.stringify(d)},${i})' title="${t('edit')}">✎</button><button class="iconsm" onclick="delClass('${d}',${i})" title="${t('del')}">✕</button></div>
    <div class="subj">${e.g?`<span class="grp">${e.g}</span>`:''}${subjOf(e)}</div>
    <div class="meta">${e.c} · <b>${e.r}</b></div>
  </div>`;
}

function renderSched(){
  renderChips();
  const box=document.getElementById('schedList');
  if(state.query){
    const q=state.query.toLowerCase();
    let html='';
    DAYS.forEach(d=>{
      const matches=state.data[d].map((e,i)=>({e,i})).filter(({e})=>{
        const hay = (typeof e.s==='object' ? Object.values(e.s).join(' ') : (e.s||'')) + ' ' + e.c + ' ' + e.r;
        return hay.toLowerCase().includes(q);
      });
      if(matches.length){ html+=`<div class="daylabel">${DNAME[state.lang][d]}</div>`+matches.map(({e,i})=>classCard(e,d,i)).join(''); }
    });
    box.innerHTML = html || `<div class="empty">🔍 —</div>`;
    scrollToTarget(box); return;
  }
  const list=state.data[state.day].slice().sort((a,b)=>toMinutes(a.t.split('-')[0])-toMinutes(b.t.split('-')[0]));
  if(!list.length){ box.innerHTML=`<div class="empty">☕ ${t('noClass')}</div>`; return; }
  box.innerHTML=list.map(e=>classCard(e, state.day, state.data[state.day].indexOf(e))).join('');
  scrollToTarget(box);
}
function scrollToTarget(box){
  if(!scrollKey) return;
  const key=scrollKey; scrollKey=null;
  const el=box.querySelector('[data-key="'+key+'"]');
  if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),60);
}
function onSearch(){ state.query=document.getElementById('searchBox').value.trim(); renderChips(); renderSched(); }

function renderStats(){
  const all=allEntries();
  const hours=Math.round(all.length*50/6)/10;
  document.getElementById('statGrid').innerHTML=`
    <div class="stat"><b>${all.length}</b><span>${t('totalClasses')}</span></div>
    <div class="stat"><b>${hours}</b><span>${t('totalHours')}</span></div>`;
  const counts={LK:0,LB:0,AM:0};
  all.forEach(e=>counts[e.y]=(counts[e.y]||0)+1);
  const max=Math.max(1,...Object.values(counts));
  document.getElementById('byType').innerHTML=Object.keys(TY).map(k=>`
    <div class="bar-row"><div class="lbl">${TY[k][state.lang]}</div><div class="bar-track"><div class="bar-fill" style="width:${(counts[k]/max*100)||0}%;background:${TY[k].col}"></div></div><div style="font-family:var(--mono)">${counts[k]}</div></div>`).join('');
}

function renderDirectory(){
  const all=allEntries();
  const teach={}, room={};
  all.forEach(e=>{ teach[e.c]=(teach[e.c]||0)+1; room[e.r]=(room[e.r]||0)+1; });
  const mk=(obj,icon)=>Object.keys(obj).sort().map(k=>`<div class="list-item" onclick="searchFor('${k.replace(/'/g,"\\'")}')"><b>${icon} ${k}</b><span>${obj[k]} ${t('sessions')}</span></div>`).join('') || `<div class="empty">${t('emptyDir')}</div>`;
  document.getElementById('teachList').innerHTML=mk(teach,'👤');
  document.getElementById('roomList').innerHTML=mk(room,'🚪');
}
function searchFor(q){ state.query=q; document.getElementById('searchBox').value=q; showTab('sched'); renderSched(); }

let scrollKey=null;
function openClassForm(day, idx){
  editCtx = (day!==undefined) ? {day, idx} : null;
  const e = editCtx ? state.data[day][idx] : {t:'',y:'LK',s:'',c:'',r:'',g:''};
  document.getElementById('sheetTitle').textContent=t('classTitle');
  document.getElementById('sheetBody').innerHTML=`
    <div class="field"><label>${t('day')}</label><select id="f_day">${DAYS.map(d=>`<option value="${d}" ${(editCtx?editCtx.day:state.day)===d?'selected':''}>${DNAME[state.lang][d]}</option>`).join('')}</select></div>
    <div class="field"><label>${t('time')}</label><input id="f_time" value="${e.t}" placeholder="10:00-10:50"></div>
    <div class="field"><label>${t('type')}</label><select id="f_type">${Object.keys(TY).map(k=>`<option value="${k}" ${e.y===k?'selected':''}>${TY[k].ab} — ${TY[k][state.lang]}</option>`).join('')}</select></div>
    <div class="field"><label>${t('subject')}</label><input id="f_subj" value="${subjOf(e).replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>${t('teacher')}</label><input id="f_teach" value="${(e.c||'').replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>${t('room')}</label><input id="f_room" value="${(e.r||'').replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>${t('subgroup')}</label><input id="f_grp" value="${e.g||''}"></div>
    <div class="sheetbtns"><button class="btn-ghost" onclick="closeSheet()">${t('cancel')}</button><button class="btn-primary" onclick="saveClass()">${t('save')}</button></div>`;
  document.getElementById('overlay').classList.remove('hide');
}
function closeSheet(){ document.getElementById('overlay').classList.add('hide'); }
function saveClass(){
  const day=document.getElementById('f_day').value;
  const subjInput=document.getElementById('f_subj').value.trim();
  let sVal=subjInput;
  if(editCtx){
    const orig=state.data[editCtx.day][editCtx.idx];
    if(orig && orig.s && typeof orig.s==='object'){ sVal={...orig.s,[state.lang]:subjInput}; }
  }
  const obj={ t:document.getElementById('f_time').value.trim()||'00:00-00:50', y:document.getElementById('f_type').value, s:sVal, c:document.getElementById('f_teach').value.trim(), r:document.getElementById('f_room').value.trim(), g:document.getElementById('f_grp').value.trim() };
  if(editCtx && editCtx.day===day){ state.data[day][editCtx.idx]=obj; }
  else { if(editCtx){ state.data[editCtx.day].splice(editCtx.idx,1); } state.data[day].push(obj); }
  scrollKey = day+'-'+state.data[day].indexOf(obj);
  ls_set('sc_data',state.data); closeSheet(); state.day=day; state.query=''; document.getElementById('searchBox').value=''; renderAll();
}
function delClass(day,idx){ if(confirm(t('delConfirm'))){ state.data[day].splice(idx,1); ls_set('sc_data',state.data); renderAll(); } }
